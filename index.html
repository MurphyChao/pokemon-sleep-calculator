<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />

		<title>PokeMasterChef – Pokémon Sleep dish team calculator</title>
		<script>
			// The theme chosen with the theme button (src/ui/theme.ts), applied before the page first draws.
			try {
				const theme = JSON.parse(localStorage.getItem("pscalc-theme"));
				if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
			} catch {}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
		<!-- Anonymous visit counts (no cookies, no personal data): https://pokemasterchef.goatcounter.com -->
		<script data-goatcounter="https://pokemasterchef.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
	</body>
</html>
